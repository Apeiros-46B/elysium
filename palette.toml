[palette]
bg0 = "#ffffff" # 0
bg1 = "#f4f4f4" # -11
bg2 = "#ebebeb" # -9
bg3 = "#e4e4e4" # -7
bg4 = "#dfdfdf" # -5
bg5 = "#dcdcdc" # -3
fg0 = "#333333"
fg1 = "#202020"
fg2 = "#000000"
fg3 = "#777777"

bg_cursor = "#fafafa"

red    = "#904961" # oklch(50% 0.1 0)
orange = "#90502a" # oklch(50% 0.1 50)
yellow = "#b38143" # oklch(64% 0.1 70)
green  = "#546b4f" # oklch(50% 0.05 140)
aqua   = "#406b75" # oklch(50% 0.05 215)
blue   = "#535d9c" # oklch(50% 0.1 275)
purple = "#79508a" # oklch(50% 0.1 315)

bg_red    = "#e9dbdf" # 20% opacity red over bg0
bg_orange = "#e9dcd4" # 20% opacity orange over bg0
bg_yellow = "#f0e6d9" # 20% opacity yellow over bg0
bg_green  = "#dce2da" # 20% opacity green+0.02c (oklch(50% 0.07 140)) over bg0
bg_aqua   = "#d5e2e5" # 20% opacity aqua+0.02c (oklch(50% 0.07 180)) over bg0
bg_blue   = "#dddfeb" # 20% opacity blue over bg0
bg_purple = "#e4dce8" # 20% opacity purple over bg0
